project:
  name: UIFAF
  version: "1.0"

image:

  max_file_size_mb: 100

  supported_extensions:
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".bmp"
    - ".tif"
    - ".tiff"
    - ".webp"

  supported_modes:
    - "1"
    - "L"
    - "LA"
    - "RGB"
    - "RGBA"
    - "CMYK"
    - "P"
    - "I;16"
    - "I"
    - "F"

bit_depth_mapping:

  "1": 1
  "L": 8
  "LA": 8
  "P": 8
  "RGB": 8
  "RGBA": 8
  "CMYK": 8
  "I;16": 16
  "I": 32
  "F": 32